[package]
name = "weatherpoem"
version = "0.2.0"
description = "WeatherPoem 桌面传统文化诗笺"
authors = ["WeatherPoem Project"]
edition = "2021"

[lib]
name = "weatherpoem_lib"
# This Windows desktop app links the library into main.exe; it does not ship a
# mobile C ABI library. Avoid linking an unused cdylib with >65K GNU exports.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
